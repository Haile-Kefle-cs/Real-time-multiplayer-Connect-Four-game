<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2E86DE">
    <title>Connect Four - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <button id="langEn" class="lang-btn active" onclick="setLanguage('en')">EN</button>
            <button id="langAm" class="lang-btn" onclick="setLanguage('am')">አማ</button>
        </div>
        
        <h1 class="game-title">🔴 Connect Four 🟡</h1>
        
        <!-- Menu Screen -->
        <div id="menu" class="screen active">
            <div class="menu-content">
                <h2 data-en="Start Playing" data-am="መጫወት ይጀምሩ">Start Playing</h2>
                
                <div class="name-input-section">
                    <label data-en="Your Name:" data-am="ስምዎ:">Your Name: <span class="required">*</span></label>
                    <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="20">
                    <small class="error-message" id="nameError"></small>
                </div>
                
                <button id="createRoomBtn" class="btn btn-primary">➕ <span data-en="Create Game" data-am="ጨዋታ ይፍጠሩ">Create Game</span></button>
                
                <div class="divider"><span data-en="OR" data-am="ወይም">OR</span></div>
                
                <div class="join-section">
                    <input type="text" id="roomCodeInput" placeholder="ABC123" maxlength="6">
                    <button id="joinRoomBtn" class="btn btn-secondary">🚪 <span data-en="Join" data-am="ይቀላቀሉ">Join</span></button>
                </div>
                
                <button id="howToPlayBtn" class="btn btn-info">📖 <span data-en="How to Play" data-am="እንዴት መጫወት">How to Play</span></button>
            </div>
        </div>
        
        <!-- Waiting Screen -->
        <div id="waiting" class="screen">
            <h2>⏳ <span data-en="Waiting for Opponent" data-am="ተቃዋሚን በመጠበቅ">Waiting for Opponent</span></h2>
            <p data-en="Share this code:" data-am="ኮድ ያጋሩ:">Share this code:</p>
            <div class="room-code-box">
                <span id="roomCodeDisplay">------</span>
                <button id="copyCodeBtn">📋 <span data-en="Copy" data-am="ቅዳ">Copy</span></button>
            </div>
            <div class="loader"></div>
            <button id="cancelWaitBtn" class="btn btn-danger" data-en="Cancel" data-am="ይቅር">Cancel</button>
        </div>
        
        <!-- Game Screen -->
        <div id="game" class="screen">
            <!-- Timer at Top -->
            <div class="timer-top-container">
                <div class="timer-top-bar">
                    <div class="timer-top-fill" id="timerBar"></div>
                </div>
                <div class="timer-top-text">
                    <span class="timer-icon">⏱️</span>
                    <span id="timerDisplay" class="timer-seconds">10</span>
                    <span class="timer-label" data-en="seconds" data-am="ሰከንድ">seconds</span>
                </div>
            </div>
            
            <!-- Game Header -->
            <div class="game-header">
                <div class="player-profile" id="playerProfile">
                    <div class="profile-avatar red-avatar"><span id="playerAvatarLetter">P</span></div>
                    <div class="profile-info">
                        <span class="profile-label" data-en="You" data-am="እርስዎ">You</span>
                        <span id="playerName" class="profile-name">Player 1</span>
                        <span id="playerScore" class="score-badge">0</span>
                    </div>
                </div>
                
                <div class="turn-indicator" id="turnIndicator">
                    <span id="turnDot" class="turn-dot red"></span>
                    <span id="turnText">Your turn</span>
                </div>
                
                <div class="player-profile" id="opponentProfile">
                    <div class="profile-info">
                        <span class="profile-label" data-en="Opponent" data-am="ተቃዋሚ">Opponent</span>
                        <span id="opponentName" class="profile-name">Player 2</span>
                        <span id="opponentScore" class="score-badge">0</span>
                    </div>
                    <div class="profile-avatar yellow-avatar"><span id="opponentAvatarLetter">O</span></div>
                </div>
            </div>
            
            <!-- Board -->
            <div class="board-container">
                <div class="board" id="board"></div>
            </div>
            
            <div class="move-info">
                <span id="moveCount">Moves: 0</span>
                <span id="lastMove">Last: -</span>
            </div>
            
            <!-- Chat -->
            <div class="chat-section">
                <div class="chat-header" id="chatHeader">
                    <span>💬</span>
                    <span data-en="Chat" data-am="ውይይት">Chat</span>
                    <button id="toggleChatBtn">▼</button>
                </div>
                <div class="chat-body" id="chatBody">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-section">
                        <input type="text" id="chatInput" placeholder="Type..." maxlength="200">
                        <button id="sendMessageBtn">📤</button>
                    </div>
                </div>
            </div>
            
            <div class="game-actions">
                <button id="restartBtn" class="btn btn-secondary" disabled>🔄 <span data-en="Play Again" data-am="እንደገና">Play Again</span></button>
                <button id="leaveBtn" class="btn btn-danger">🚪 <span data-en="Leave" data-am="ይውጡ">Leave</span></button>
            </div>
        </div>
        
        <!-- Game Over Modal -->
        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <div id="confettiContainer"></div>
                <div id="gameOverEmoji">🏆</div>
                <h2 id="gameOverTitle">Winner!</h2>
                <div id="winnerAvatar" class="winner-avatar red"><span id="winnerAvatarLetter">W</span></div>
                <div id="winnerName" class="winner-name"></div>
                <p id="gameOverMessage"></p>
                <div class="modal-buttons">
                    <button id="playAgainBtn" class="btn btn-primary">🔄 Play Again</button>
                    <button id="backToMenuBtn" class="btn btn-secondary">🏠 Menu</button>
                </div>
            </div>
        </div>
        
        <div id="toast" class="toast"></div>
        <div id="connectionStatus" class="connection-status">Connecting...</div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
